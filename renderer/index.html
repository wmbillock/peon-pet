<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' peon-asset:; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' peon-asset:;">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 200px; height: 200px; overflow: hidden; background: transparent; }
    canvas { display: block; }
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(8, 8, 16, 0.88);
      color: #bbb;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
    }
    #sound-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      background: rgba(8, 8, 16, 0.7);
      color: #ddd;
      cursor: pointer;
      z-index: 101;
      opacity: 0.55;
    }
    #sound-btn:hover { opacity: 1; }
    #sound-btn.muted { color: #ff6060; border-color: #ff6060; opacity: 1; }
    #sound-btn svg { display: block; width: 100%; height: 100%; }
    #sound-btn .waves { display: inline; }
    #sound-btn .slash { display: none; }
    #sound-btn.muted .waves { display: none; }
    #sound-btn.muted .slash { display: inline; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="tooltip"></div>
  <button id="sound-btn" title="Mute sounds" aria-label="Mute sounds">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3,9 7,9 12,5 12,19 7,15 3,15" fill="currentColor"/>
      <g class="waves"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></g>
      <g class="slash"><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></g>
    </svg>
  </button>
  <script type="module" src="app.js"></script>
</body>
</html>
