<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' peon-asset:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' peon-asset:;">
  <link rel="stylesheet" href="../dash/dash.css">
  <link rel="stylesheet" href="../dash/frames.css">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; }
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(8, 8, 16, 0.88);
      color: #bbb;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
    }
    /* ---- corner views: Pet · Grid · Speaker · Presenter ---- */
    /* ---- summary strip: counts you can click to dive in ---- */
    #summary { position: absolute; top: 5px; left: 6px; z-index: 103; max-width: 164px; display: flex; align-items: center; gap: 2px; padding: 2px 3px;
               border-radius: 11px; background: rgba(8, 8, 16, 0.80); border: 1px solid rgba(255, 255, 255, 0.16); cursor: pointer; white-space: nowrap;
               font: 600 10px/16px -apple-system, sans-serif; color: #ddd; overflow: hidden; }
    #summary:hover { background: rgba(28, 28, 58, 0.92); border-color: rgba(160, 160, 255, 0.5); }
    #summary button { all: unset; cursor: pointer; padding: 0 3px; border-radius: 8px; flex: none; }
    #summary button:hover { background: rgba(255, 255, 255, 0.14); }
    #summary .work { color: #6dff7a; } #summary .idle { color: #9fb0c8; } #summary .alert { color: #ffcc55; animation: blink 1.1s ease-in-out infinite; }
    #summary .sep { width: 1px; height: 12px; margin: 0 2px; background: rgba(255, 255, 255, 0.2); }
    #summary .none { padding: 0 6px; color: #8a8aa0; font-weight: 500; }
    body.dashing #summary { display: none; }
    @keyframes blink { 50% { opacity: 0.45; } }
    /* the hover toolbar drops below the strip in pet mode; in the agent views it takes the top row */
    #bar { position: absolute; top: 30px; left: 6px; z-index: 102; display: flex; gap: 2px; padding: 2px; border-radius: 7px;
           background: rgba(8, 8, 16, 0.78); border: 1px solid rgba(255, 255, 255, 0.14); opacity: 0; transition: opacity .15s; }
    body:hover #bar, body.dashing #bar { opacity: 1; }
    #bar button { width: 22px; height: 20px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: #aab; cursor: pointer; font: 12px/20px -apple-system, sans-serif; }
    #bar button:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }
    #bar button.on { color: #fff; background: rgba(120, 120, 255, 0.45); }
    body:not(.dashing) #bar .dashonly { display: none; }
    #bar button.lit { color: #fff; background: rgba(120, 220, 140, 0.35); }
    #bar .sep { width: 1px; margin: 3px 2px; background: rgba(255, 255, 255, 0.15); }
    #dash { font: 11px -apple-system, 'SF Mono', sans-serif; color: #ccc; position: absolute; left: 0; right: 0; bottom: 0; top: 0; padding: 34px 8px 26px; overflow: auto; display: none;
            background: rgba(12, 12, 20, 0.94); border: 1px solid #2a2a40; border-radius: 10px; z-index: 50; }
    body.dashing #bar { top: 5px; }
    body.dashing #dash { display: block; }
    body.dashing canvas { display: none; }
    #dash::-webkit-scrollbar { width: 6px; height: 6px; }
    #dash::-webkit-scrollbar-thumb { background: #33334a; border-radius: 3px; }
    /* a wide, always-visible grip for moving the window: drag it anywhere along the bottom-centre pill */
    #grip { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 84px; height: 18px; z-index: 110; display: flex; align-items: center; justify-content: center; gap: 4px;
            border-radius: 9px; background: rgba(8, 8, 16, 0.78); border: 1px solid rgba(255, 255, 255, 0.28); box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5); cursor: grab; opacity: 0.7; transition: opacity .15s, background .15s; touch-action: none; }
    #grip i { width: 14px; height: 3px; border-radius: 2px; background: rgba(230, 230, 255, 0.75); }
    #grip:hover, #grip.grabbing { opacity: 1; background: rgba(40, 40, 80, 0.92); border-color: rgba(170, 170, 255, 0.8); }
    #grip.grabbing { cursor: grabbing; }
    #grip:focus-visible { outline: 2px solid #6aa7ff; outline-offset: 2px; }
    #sound-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      background: rgba(8, 8, 16, 0.7);
      color: #ddd;
      cursor: pointer;
      z-index: 101;
      opacity: 0.55;
    }
    #sound-btn:hover { opacity: 1; }
    #sound-btn.muted { color: #ff6060; border-color: #ff6060; opacity: 1; }
    #sound-btn svg { display: block; width: 100%; height: 100%; }
    #sound-btn .waves { display: inline; }
    #sound-btn .slash { display: none; }
    #sound-btn.muted .waves { display: none; }
    #sound-btn.muted .slash { display: inline; }
    /* ---- Euphonia chat bubble ---- */
    #chat { display: none; position: absolute; inset: 0; z-index: 60; flex-direction: column; box-sizing: border-box; padding: 34px 8px 26px;
            background: rgba(12, 12, 20, 0.95); border: 1px solid #2a2a40; border-radius: 10px; font: 12px/1.4 -apple-system, sans-serif; color: #ddd; }
    body.chatting #chat { display: flex; }
    body.chatting canvas { display: none; }
    #chat-head { display: flex; align-items: center; gap: 6px; padding: 0 2px 6px; color: #aab; font-weight: 600; }
    #chat-head img { width: 24px; height: 24px; border-radius: 6px; image-rendering: pixelated; }
    #chat-head .sub { margin-left: auto; font-weight: 400; font-size: 10px; color: #7a7a90; }
    #chat-head button { all: unset; cursor: pointer; font-size: 10px; color: #7a7a90; padding: 0 4px; }
    #chat-head button:hover { color: #fff; }
    #chat-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px; user-select: text; }
    #chat-list::-webkit-scrollbar { width: 6px; } #chat-list::-webkit-scrollbar-thumb { background: #33334a; border-radius: 3px; }
    .msg { max-width: 88%; padding: 5px 8px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: rgba(110, 110, 255, 0.35); }
    .msg.assistant { align-self: flex-start; background: rgba(255, 255, 255, 0.09); }
    .msg.pending:empty::before { content: '\2026'; color: #8a8aa0; }
    #chat-status { min-height: 14px; font-size: 10px; color: #8a8aa0; padding: 2px 4px; }
    #chat-status.busy::before { content: '\25CF '; color: #6dff7a; animation: blink 1.1s ease-in-out infinite; }
    #chat-error { display: none; margin: 2px 0; padding: 4px 8px; border-radius: 6px; background: rgba(255, 90, 90, 0.18); border: 1px solid #ff6060; color: #ffb0b0; font-size: 11px; cursor: pointer; }
    #chat-error.on { display: block; }
    #chat-form { display: flex; gap: 4px; align-items: flex-end; }
    #chat-input { flex: 1; resize: none; height: 40px; max-height: 90px; box-sizing: border-box; padding: 5px 7px; border-radius: 8px; border: 1px solid #33334a;
                  background: #181826; color: #eee; font: 12px/1.35 -apple-system, sans-serif; outline: none; }
    #chat-input:focus { border-color: #6a6aff; }
    #chat-input:disabled { opacity: 0.55; }
    #chat-send { height: 28px; padding: 0 9px; border: 0; border-radius: 8px; background: rgba(110, 110, 255, 0.55); color: #fff; cursor: pointer; font: 600 11px -apple-system, sans-serif; }
    #chat-send:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="tooltip"></div>
  <div id="dframe"></div>
  <div id="summary" data-tip="Agents right now\nClick for everyone"></div>
  <div id="dash"></div>
  <div id="chat">
    <div id="chat-head"><img id="chat-avatar" alt=""><span>Euphonia</span><span class="sub" id="chat-sub"></span><button id="chat-new" data-tip="Start a fresh conversation (the old one is kept)">new</button></div>
    <div id="chat-list" aria-live="polite"></div>
    <div id="chat-status"></div>
    <div id="chat-error" role="alert" title="Click to dismiss"></div>
    <form id="chat-form"><textarea id="chat-input" rows="2" placeholder="Ask Euphonia… (Enter sends, Shift+Enter newline)"></textarea><button id="chat-send" type="submit">Send</button></form>
  </div>
  <div id="grip" role="button" tabindex="0" aria-label="Drag to move the window" data-tip="Drag to move"><i></i><i></i><i></i></div>
  <div id="bar" data-tip="Drag here to move">
    <button data-v="pet" data-tip="Pet">🐾</button>
    <button data-v="grid" data-tip="Grid — everyone">▦</button>
    <button data-v="speaker" data-tip="Speaker — whoever is working">◉</button>
    <button data-v="presenter" data-tip="Presenter — a master and its sub-agents">▣</button>
    <button data-v="chat" data-tip="Euphonia — chat">💬</button>
    <span class="sep"></span>
    <button id="flt" class="dashonly" data-tip="Filter: all">◔</button>
    <button id="grp" class="dashonly" data-tip="Group by project">🗂</button>
    <button id="gear" data-tip="Settings">⚙</button>
  </div>
  <button id="sound-btn" title="Mute sounds" aria-label="Mute sounds">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3,9 7,9 12,5 12,19 7,15 3,15" fill="currentColor"/>
      <g class="waves"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></g>
      <g class="slash"><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></g>
    </svg>
  </button>
  <script src="chat-model.js"></script>
  <script src="../dash/summary.js"></script>
  <script src="../dash/tip.js"></script>
  <script src="../dash/dash.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
