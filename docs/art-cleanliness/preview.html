<!doctype html><meta charset="utf-8"><title>Pet art cleanliness review</title>
<style>body{background:#253343;color:#eef3f8;font:16px system-ui;margin:32px}select,input{font:inherit;margin:8px}main{display:flex;gap:32px}canvas{background:repeating-conic-gradient(#354455 0% 25%,#2b3949 0% 50%) 0/24px 24px;image-rendering:pixelated;border:1px solid #657689}h1{font-size:24px}p{max-width:750px}label{display:inline-block}</style>
<h1>Pet art cleanliness review</h1><p>Original and repaired frames, rendered with the desktop pet's Three.js texture settings. Choose a pet, animation and display size.</p>
<label>Pet <select id="pet"></select></label><label>Animation <select id="state"><option>sleeping</option><option>waking</option><option selected>typing</option><option>alarmed</option><option>celebrate</option><option>annoyed</option></select></label>
<label>Size <select id="size"><option>64</option><option>96</option><option selected>200</option><option>320</option></select></label><label><input id="play" type="checkbox" checked>Animate</label><label>Frame <input id="frame" type="range" min="0" max="5" value="0"></label>
<main><section><h2>Before</h2><canvas id="before"></canvas></section><section><h2>After</h2><canvas id="after"></canvas></section></main><p id="status">Loading…</p>
<script src="../../lib/frame-uv.js"></script><script type="module">
import * as THREE from '../../node_modules/three/build/three.module.js';
const $=id=>document.getElementById(id), pet=$('pet'),state=$('state'),size=$('size'),play=$('play'),frame=$('frame'),status=$('status');
const data=await fetch('../../output/art-cleanliness/validation.json').then(r=>r.json());
for(const s of [...data].sort((a,b)=>a.slug.localeCompare(b.slug))){const o=document.createElement('option');o.value=o.textContent=s.slug;pet.append(o);}pet.value='marvin';
const panels=['before','after'].map(id=>{const renderer=new THREE.WebGLRenderer({canvas:$(id),alpha:true,antialias:false});renderer.setPixelRatio(devicePixelRatio);const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-100,100,100,-100,.1,10);camera.position.z=1;const geometry=new THREE.PlaneGeometry(180,180),material=new THREE.MeshBasicMaterial({transparent:true,alphaTest:.01});scene.add(new THREE.Mesh(geometry,material));return{id,renderer,scene,camera,geometry,material};});
let generation=0,ready=false,last=0;
async function load(){ready=false;status.textContent='Loading '+pet.value+'…';const token=++generation;await Promise.all(panels.map(async p=>{const url=p.id==='before'?'../../output/art-cleanliness/before/renderer/assets/'+pet.value+'-sprite-atlas.png':'../../output/art-cleanliness/renderer/assets/'+pet.value+'-sprite-atlas.png';const tex=await new THREE.TextureLoader().loadAsync(url);tex.magFilter=tex.minFilter=THREE.NearestFilter;tex.generateMipmaps=false;if(token!==generation){tex.dispose();return;}p.material.map?.dispose();p.material.map=tex;p.material.needsUpdate=true;}));if(token!==generation)return;ready=true;draw();status.textContent=data.length+' pets · 36 frames each · '+pet.value;}
function draw(){if(!ready)return;const row=state.selectedIndex,f=Number(frame.value),px=Number(size.value);for(const p of panels){p.renderer.setSize(px,px,false);p.renderer.domElement.style.width=p.renderer.domElement.style.height=px+'px';const image=p.material.map.image;const uv=window.peonFrameUVs(f,row,6,6,p.id==='after'?image.width:0,p.id==='after'?image.height:0);const a=p.geometry.attributes.uv;a.setXY(0,uv.u0,uv.v1);a.setXY(1,uv.u1,uv.v1);a.setXY(2,uv.u0,uv.v0);a.setXY(3,uv.u1,uv.v0);a.needsUpdate=true;p.renderer.render(p.scene,p.camera);}}
pet.onchange=()=>load().catch(e=>status.textContent=e.message);state.onchange=()=>{frame.value=0;draw();};size.onchange=draw;frame.oninput=()=>{play.checked=false;draw();};function tick(now){if(play.checked&&now-last>166){last=now;frame.value=(Number(frame.value)+1)%6;draw();}requestAnimationFrame(tick);}await load();requestAnimationFrame(tick);
</script>
