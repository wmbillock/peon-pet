<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: peon-asset:; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Peon Pet — Agents</title>
  <link rel="stylesheet" href="../dash/dash.css">
  <link rel="stylesheet" href="grid.css">
</head>
<body>
  <header>
    <h1>Agents <span id="count"></span></h1>
    <nav id="views" title="G · S · P">
      <button data-view="grid">Grid</button>
      <button data-view="speaker">Speaker</button>
      <button data-view="presenter">Presenter</button>
    </nav>
    <span class="spacer"></span>
    <span id="firm" class="chip" title="The Firm"></span>
    <label id="cold-wrap" title="Show agents that have gone quiet"><input type="checkbox" id="show-cold"> include idle</label>
    <label id="follow-wrap" title="Speaker view follows whoever is working"><input type="checkbox" id="follow"> follow activity</label>
    <label id="zoom-wrap">Zoom <input type="range" id="zoom" min="110" max="420" step="4"></label>
    <button id="open-panel">Panel</button>
  </header>
  <div id="slices">
    <span class="lbl">Show</span><span id="sl-status" class="seg"></span>
    <span class="lbl">Group by</span><span id="sl-group" class="seg"></span>
    <span class="lbl">Slice</span><span id="sl-types"></span><span id="sl-tools"></span>
    <span class="lbl">Projects</span><span id="sl-projects"></span>
  </div>
  <main id="stage"></main>
  <script src="../dash/summary.js"></script>
  <script src="../dash/dash.js"></script>
  <script src="grid.js"></script>
</body>
</html>
